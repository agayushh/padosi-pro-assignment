services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: padosi
      POSTGRES_PASSWORD: padosi
      POSTGRES_DB: padosipro
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padosi -d padosipro"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://padosi:padosi@db:5432/padosipro?schema=public
      ACCESS_TOKEN_SECRET: dev-only-access-token-secret
      OTP_PEPPER: dev-only-otp-pepper-value
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM: PadosiPro <noreply@padosipro.local>
      PORT: "3001"
      NODE_ENV: development
      REFRESH_TOKEN_DAYS: "30"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

volumes:
  pgdata:
